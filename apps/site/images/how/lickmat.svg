<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
<defs>
  <radialGradient id="bg-lickmat" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#effbf4"/><stop offset="1" stop-color="#b4ecc9"/>
  </radialGradient>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2b2118" flood-opacity=".22"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  <linearGradient id="lm-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ee2b8"/><stop offset="1" stop-color="#5cc28a"/></linearGradient>
  <linearGradient id="lm-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7c9ff"/><stop offset="1" stop-color="#7c98f2"/></linearGradient>
  <pattern id="lm-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="6" fill="#6f8ae6"/><circle cx="9" cy="9" r="2.5" fill="#d8e2ff"/></pattern>
  <pattern id="lm-ridge" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0,9 q4.5,-7 9,0 t9,0" stroke="#6f8ae6" stroke-width="4" fill="none"/></pattern>
  <pattern id="lm-lines" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="16" fill="#6f8ae6"/></pattern>
  <pattern id="lm-gdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="7" fill="#4fae7a"/></pattern>
  <linearGradient id="pb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a066"/><stop offset="1" stop-color="#b9783e"/></linearGradient></defs>
<rect width="800" height="800" fill="url(#bg-lickmat)"/>
<circle cx="400" cy="380" r="300" fill="#fff" opacity=".28"/>
<ellipse cx="400" cy="705" rx="230" ry="26" fill="#2b2118" opacity=".16" filter="url(#blur)"/>
<g transform="translate(-20,-40) scale(.98)">
  <!-- back mat (green) with suction cups -->
  <g filter="url(#drop)" transform="rotate(-14 330 330)">
    <rect x="150" y="150" width="360" height="360" rx="54" fill="url(#lm-a)" stroke="#4fae7a" stroke-width="4"/>
    <rect x="186" y="186" width="288" height="288" rx="36" fill="url(#lm-gdots)" opacity=".85"/>
  </g>
  <!-- front mat (blue), 4 textures -->
  <g filter="url(#drop)" transform="rotate(9 460 460)">
    <rect x="270" y="270" width="380" height="380" rx="56" fill="url(#lm-b)" stroke="#6f8ae6" stroke-width="4"/>
    <rect x="304" y="304" width="148" height="148" rx="22" fill="url(#lm-dots)"/>
    <rect x="468" y="304" width="148" height="148" rx="22" fill="url(#lm-ridge)"/>
    <rect x="304" y="468" width="148" height="148" rx="22" fill="url(#lm-lines)"/>
    <g fill="none" stroke="#6f8ae6" stroke-width="7"><circle cx="542" cy="542" r="62"/><circle cx="542" cy="542" r="40"/><circle cx="542" cy="542" r="18"/></g>
    <!-- xylitol-free peanut butter smear -->
    <path d="M478,330 C520,306 600,318 604,356 C608,392 560,404 520,396 C486,390 452,362 478,330 Z" fill="url(#pb)"/>
    <path d="M496,336 C526,322 572,328 584,348" stroke="#f1c48f" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</g>
</svg>