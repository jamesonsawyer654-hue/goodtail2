<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thank you! — {store}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav"><div class="wrap"><a class="logo" href="index.html"><span>●</span> <b data-s="name"></b></a></div></header>
  <main class="policy" style="text-align:center">
    <div style="font-size:72px">🐾</div>
    <h1>Order confirmed. Thank you!</h1>
    <p style="font-size:18px">Your receipt is on its way to your inbox. Your order ships within 1–3 business days, and we'll email your tracking number as soon as it does.</p>
    <p>Usual delivery time: <b data-s="shippingTime"></b>.</p>
    <p>Questions? Email <a data-s="email"></a>. A real person will reply.</p>
    <p style="margin-top:32px"><a class="btn" href="index.html">Back to the shop</a></p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>document.querySelectorAll('a[data-s="email"]').forEach(a => a.href = "mailto:" + STORE.email);</script>
</body>
</html>
