<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
<defs>
  <radialGradient id="bg-roller" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#bccbff"/>
  </radialGradient>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2b2118" flood-opacity=".22"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  <linearGradient id="ro-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ebf4"/></linearGradient>
  <linearGradient id="ro-accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9db4ff"/><stop offset="1" stop-color="#5f82f0"/></linearGradient>
  <pattern id="ro-fabric" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="12" height="12" fill="#e2536a"/><rect width="5" height="12" fill="#cc3f57"/>
  </pattern>
  <linearGradient id="ro-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
  <clipPath id="ro-win"><rect x="272" y="196" width="256" height="112" rx="32"/></clipPath></defs>
<rect width="800" height="800" fill="url(#bg-roller)"/>
<circle cx="400" cy="380" r="300" fill="#fff" opacity=".28"/>
<ellipse cx="400" cy="705" rx="230" ry="26" fill="#2b2118" opacity=".16" filter="url(#blur)"/>
<g transform="rotate(16 400 440) translate(0,-6)"><g filter="url(#drop)">
  <!-- handle -->
  <rect x="362" y="420" width="76" height="300" rx="38" fill="url(#ro-body)" stroke="#d5dceb" stroke-width="3"/>
  <rect x="377" y="470" width="46" height="200" rx="23" fill="url(#ro-accent)"/>
  <g stroke="#c7d3ff" stroke-width="3" stroke-linecap="round" opacity=".8"><line x1="390" y1="510" x2="410" y2="510"/><line x1="390" y1="540" x2="410" y2="540"/><line x1="390" y1="570" x2="410" y2="570"/><line x1="390" y1="600" x2="410" y2="600"/></g>
  <!-- head housing -->
  <rect x="236" y="160" width="328" height="290" rx="64" fill="url(#ro-body)" stroke="#d5dceb" stroke-width="3"/>
  <!-- see-through fur chamber -->
  <rect x="272" y="196" width="256" height="112" rx="32" fill="#dfe7ff" stroke="#b9c8f5" stroke-width="3"/>
  <g clip-path="url(#ro-win)">
    <path d="M272,300 C300,250 330,262 352,246 C372,226 412,238 430,250 C452,232 494,240 528,268 L528,320 L272,320 Z" fill="#e8d8c0"/>
    <path d="M290,296 q20,-14 40,-2 M360,278 q22,-12 44,0 M440,282 q20,-10 40,2" stroke="#cdb08a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="272" y="196" width="256" height="40" fill="#fff" opacity=".35"/>
  </g>
  <!-- release button -->
  <rect x="364" y="142" width="72" height="30" rx="15" fill="url(#ro-accent)"/>
  <!-- fabric roller drum -->
  <rect x="226" y="326" width="348" height="112" rx="56" fill="url(#ro-fabric)"/>
  <rect x="226" y="326" width="348" height="112" rx="56" fill="url(#ro-shine)"/>
  <ellipse cx="236" cy="382" rx="22" ry="54" fill="#cdd6e8"/><ellipse cx="564" cy="382" rx="22" ry="54" fill="#cdd6e8"/>
</g>
  <!-- loose hairs being picked up -->
  <g stroke="#a88a62" stroke-width="3" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M200,520 q14,-10 28,0"/><path d="M178,560 q12,-14 30,-4"/><path d="M590,520 q14,-12 30,0"/><path d="M612,560 q10,-10 24,-2"/>
  </g>
</g>
</svg>