<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
<defs>
  <radialGradient id="bg-brush" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#fff1e6"/><stop offset="1" stop-color="#ffc9a6"/>
  </radialGradient>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2b2118" flood-opacity=".22"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  <linearGradient id="br-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e8ee"/></linearGradient>
  <linearGradient id="br-handle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa477"/><stop offset="1" stop-color="#f06a32"/></linearGradient>
  <radialGradient id="br-pad" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="#eef1f5"/><stop offset="1" stop-color="#d5dbe3"/></radialGradient>
  <pattern id="br-pins" width="13" height="13" patternUnits="userSpaceOnUse">
    <line x1="3" y1="11" x2="8" y2="4" stroke="#7d8796" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="8" cy="4" r="1.9" fill="#4b5563"/>
  </pattern>
  <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6ead9"/><stop offset="1" stop-color="#d9c2a2"/></linearGradient></defs>
<rect width="800" height="800" fill="url(#bg-brush)"/>
<circle cx="400" cy="380" r="300" fill="#fff" opacity=".28"/>
<ellipse cx="400" cy="705" rx="230" ry="26" fill="#2b2118" opacity=".16" filter="url(#blur)"/>
<g transform="rotate(-20 400 430) translate(0,10)"><g filter="url(#drop)">
  <!-- handle -->
  <path d="M368,452 L432,452 C442,545 456,628 454,682 Q452,738 400,738 Q348,738 346,682 C344,628 358,545 368,452 Z" fill="url(#br-handle)"/>
  <path d="M382,520 L418,520 C424,580 430,630 429,668 Q428,690 400,690 Q372,690 371,668 C370,630 376,580 382,520 Z" fill="#e2602b" opacity=".55"/>
  <g stroke="#ffb08a" stroke-width="3" stroke-linecap="round" opacity=".7">
    <line x1="386" y1="560" x2="414" y2="560"/><line x1="385" y1="585" x2="415" y2="585"/><line x1="384" y1="610" x2="416" y2="610"/><line x1="384" y1="635" x2="416" y2="635"/>
  </g>
  <circle cx="400" cy="712" r="9" fill="#ffd9c4"/>
  <!-- head -->
  <ellipse cx="400" cy="300" rx="186" ry="160" fill="url(#br-body)" stroke="#cfd6df" stroke-width="3"/>
  <ellipse cx="400" cy="300" rx="154" ry="128" fill="url(#br-pad)"/>
  <ellipse cx="400" cy="300" rx="154" ry="128" fill="url(#br-pins)"/>
  <ellipse cx="400" cy="300" rx="154" ry="128" fill="none" stroke="#c3cad4" stroke-width="3"/>
  <!-- highlight -->
  <path d="M262,236 Q300,170 380,156" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9"/>
  <!-- push button -->
  <circle cx="400" cy="458" r="30" fill="#fff" stroke="#cfd6df" stroke-width="3"/>
  <circle cx="400" cy="458" r="19" fill="url(#br-handle)"/>
  <circle cx="394" cy="451" r="5" fill="#fff" opacity=".8"/>
</g>
  <!-- fur tuft sliding off -->
  <g transform="translate(470,170) rotate(14)">
    <path d="M0,40 C-10,10 25,-8 45,8 C60,-12 100,-4 102,22 C130,18 146,48 128,66 C140,88 112,110 88,98 C72,118 30,116 22,94 C-6,98 -22,62 0,40 Z" fill="url(#fur)" stroke="#cdb08a" stroke-width="2"/>
    <g stroke="#c4a37a" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8">
      <path d="M22,46 q18,-10 36,0"/><path d="M50,70 q20,-12 40,0"/><path d="M70,40 q14,-8 28,2"/><path d="M30,80 q10,-6 20,0"/>
    </g>
  </g>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".9">
    <line x1="640" y1="210" x2="690" y2="196"/><line x1="650" y1="245" x2="712" y2="236"/><line x1="640" y1="280" x2="684" y2="276"/>
  </g>
</g>
</svg>