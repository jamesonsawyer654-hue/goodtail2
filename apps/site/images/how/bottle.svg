<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
<defs>
  <radialGradient id="bg-bottle" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#ecfaff"/><stop offset="1" stop-color="#a9e2f6"/>
  </radialGradient>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2b2118" flood-opacity=".22"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  <linearGradient id="bo-body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9f8fe"/><stop offset=".5" stop-color="#d3f0fb"/><stop offset="1" stop-color="#b9e4f5"/></linearGradient>
  <linearGradient id="bo-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb6e3"/><stop offset="1" stop-color="#1f8cc0"/></linearGradient>
  <linearGradient id="bo-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd8f5"/><stop offset="1" stop-color="#4fb6e6"/></linearGradient>
  <clipPath id="bo-clip"><rect x="300" y="240" width="200" height="460" rx="62"/></clipPath></defs>
<rect width="800" height="800" fill="url(#bg-bottle)"/>
<circle cx="400" cy="380" r="300" fill="#fff" opacity=".28"/>
<ellipse cx="400" cy="705" rx="230" ry="26" fill="#2b2118" opacity=".16" filter="url(#blur)"/>
<g transform="rotate(-8 400 440) translate(-24,8)"><g filter="url(#drop)">
  <!-- wrist strap -->
  <path d="M318,232 C246,170 262,74 332,82 C392,90 388,170 360,226" stroke="#33465a" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <rect x="300" y="240" width="200" height="460" rx="62" fill="url(#bo-body)" stroke="#9fd3e8" stroke-width="3"/>
  <g clip-path="url(#bo-clip)">
    <path d="M300,400 C340,386 372,414 410,400 C446,388 474,410 500,398 L500,710 L300,710 Z" fill="url(#bo-water)" opacity=".85"/>
    <rect x="318" y="262" width="20" height="410" rx="10" fill="#fff" opacity=".65"/>
  </g>
  <!-- paw print -->
  <g fill="#ffffff" opacity=".75" transform="translate(400,560) scale(1.15)">
    <ellipse cx="0" cy="10" rx="20" ry="16"/><ellipse cx="-24" cy="-12" rx="8" ry="11"/><ellipse cx="-8" cy="-26" rx="8" ry="11"/><ellipse cx="10" cy="-26" rx="8" ry="11"/><ellipse cx="25" cy="-12" rx="8" ry="11"/>
  </g>
  <!-- cap -->
  <rect x="294" y="196" width="212" height="78" rx="32" fill="url(#bo-top)"/>
  <rect x="376" y="210" width="48" height="20" rx="10" fill="#ffffff"/>
  <!-- fold-out drinking trough -->
  <path d="M492,206 C568,150 676,166 706,226 C664,292 552,296 492,262 Z" fill="url(#bo-top)"/>
  <path d="M510,222 C572,186 652,194 684,230 C648,270 560,274 510,250 Z" fill="#a9e4f8"/>
  <path d="M530,232 C580,212 640,214 668,232" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
</g>
  <!-- drops -->
  <g fill="#3fb6e3"><path d="M640,300 q10,18 0,26 q-10,-8 0,-26 Z"/><path d="M676,330 q8,14 0,20 q-8,-6 0,-20 Z"/></g>
</g>
</svg>